<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noughts &amp; Crosses</title>
<meta name="description" content="The old pencil-and-paper game, for two friends on two screens.">
<style>
@font-face { font-family: "Courier Prime"; src: url("CourierPrime.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Courier Prime"; src: url("CourierPrime-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
:root {
  --paper: #f8f6f1; --ink: #1c1b19; --soft: #6e6b64; --hair: #d9d5cb; --tint: #ebe7dd; --ribbon: #b3261e;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  margin: 0; min-height: 100dvh; background: var(--paper); color: var(--ink); overflow-x: hidden;
  font: 16px/1.5 "Courier Prime", "Courier New", Courier, monospace;
}
main { max-width: 860px; margin: 0 auto; padding: 40px 20px 56px; }
h1, h2 { font-weight: 400; margin: 0; }
h1 { font-size: clamp(38px, 9vw, 56px); line-height: 1.1; letter-spacing: -.02em; }
h1::after { content: ""; display: inline-block; width: .5em; height: .08em; margin-left: .1em; background: var(--ribbon); animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
h2 { font-size: 26px; line-height: 1.2; letter-spacing: -.01em; }
p { margin: 0; color: var(--soft); }
.screen { display: none; }
.screen.on { display: block; }
.stack { max-width: 400px; margin: 14vh auto 0; display: grid; gap: 34px; }
.stack > div { display: grid; gap: 10px; }
.card { display: grid; gap: 14px; }
.stack > .card + .card { border-top: 1px solid var(--hair); padding-top: 28px; }
label { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); display: grid; gap: 4px; }
input {
  width: 100%; padding: 8px 0; font: inherit; font-size: 18px; letter-spacing: 0; text-transform: none; color: var(--ink);
  background: none; border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; outline: none;
}
input::placeholder { color: #b0aca2; }
input:focus { border-bottom-width: 2px; margin-bottom: -1px; }
input#codeIn { text-transform: uppercase; letter-spacing: .08em; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn {
  padding: 11px 18px; border: 1px solid var(--ink); border-radius: 0; background: none; color: var(--ink);
  font-size: 13px; letter-spacing: .1em; text-transform: uppercase; transition: background .15s, color .15s;
}
.btn:hover:not(:disabled), .btn.main { background: var(--ink); color: var(--paper); }
.btn.main:hover:not(:disabled) { background: #3a3834; }
.btn:disabled { opacity: .35; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .grow { flex: 1 1 auto; }
.err { color: var(--ribbon); min-height: 1.5em; font-size: 14px; }
.code { font-size: clamp(38px, 11vw, 52px); line-height: 1.1; text-align: center; padding: 14px 0; letter-spacing: .04em; user-select: all; }
.pulse { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--ink); margin-bottom: 18px; }
.side { display: flex; gap: 16px; align-items: center; font-size: 13px; color: var(--soft); }
.link { background: none; border: 0; padding: 2px 0; color: var(--soft); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.dot { display: inline-block; width: 6px; height: 6px; background: var(--ink); margin-right: 8px; vertical-align: 1px; }
.dot.off { background: var(--ribbon); }

.status { margin: 0 0 26px; min-height: 26px; color: var(--soft); }
.status.mine { color: var(--ink); }
.status.lost { color: var(--ribbon); }
@media (max-width: 720px) {
  main { padding: 24px 16px 40px; }
  .stack { margin-top: 8vh; }
  }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.status { text-align: center; }
.score { display: flex; justify-content: space-between; gap: 12px; max-width: 380px; margin: 0 auto 24px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); width: min(100%, 380px); aspect-ratio: 1; margin: 0 auto 26px; container-type: inline-size; }
.grid button { min-width: 0; padding: 0; border: 0; background: none; color: var(--ink); font-size: 21cqw; line-height: 1; }
.grid button:nth-child(3n+1), .grid button:nth-child(3n+2) { border-right: 1px solid var(--ink); }
.grid button:nth-child(-n+6) { border-bottom: 1px solid var(--ink); }
.grid button:hover:not(:disabled) { background: var(--tint); }
.grid button:disabled { cursor: default; color: var(--ink); opacity: 1; }
.grid .win:disabled { color: var(--ribbon); font-weight: 700; }
.grid .new { animation: strike .12s steps(2); }
@keyframes strike { from { transform: translateY(-8%); opacity: .4; } }
#nextBtn:not([hidden]) { display: block; margin: 0 auto; }
</style>
</head>
<body>
<main>
  <section class="screen on" id="home">
    <div class="stack">
      <div>
        <h1>Noughts &amp; Crosses</h1>
        <p>The old pencil-and-paper game, for two friends on two screens.</p>
      </div>
      <div class="card">
        <label>Your name <input id="nameIn" maxlength="16" autocomplete="off" placeholder="Type your name"></label>
        <button class="btn main" id="hostBtn">Start a room</button>
      </div>
      <div class="card">
        <label>Room code <input id="codeIn" maxlength="12" autocomplete="off" placeholder="QUILL-42"></label>
        <button class="btn" id="joinBtn">Join your friend</button>
        <p class="err" id="homeErr" role="alert"></p>
      </div>
    </div>
  </section>

  <section class="screen" id="wait">
    <div class="stack">
      <div>
        <h2 id="waitTitle">Your room is ready</h2>
        <p>Send this code to your friend.</p>
      </div>
      <div class="card">
        <div class="code" id="codeOut"></div>
        <button class="btn" id="copyBtn">Copy invite link</button>
      </div>
      <p class="pulse" id="waitNote">Waiting for your friend to arrive…</p>
      <button class="link" data-leave>Leave</button>
    </div>
  </section>

  <section class="screen" id="play">
    <div class="top"><h2>Noughts &amp; Crosses</h2><div class="side"><span data-conn></span><button class="link" id="soundBtn"></button></div></div>
    <p class="status" id="status" role="status"></p>
    <div class="score"><span id="myScore"></span><span id="drawScore"></span><span id="foeScore"></span></div>
    <div class="grid" id="grid"></div>
    <button class="btn main" id="nextBtn" hidden>Next round</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="game.js"></script>
</body>
</html>
